name: Test RenPy 8.5.3 Boot

on:
  push:
    branches:
      - arena/a685ecde-drak
    paths:
      - ".github/workflows/test_renpy.yml"
      - "tools/test_renpy_load.py"

permissions:
  contents: write

jobs:
  test_boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/a685ecde-drak
          fetch-depth: 0

      - name: Compile +00kurdish_tl.rpyc & verify .rpyc patcher with official Ren'Py 8.5.3 SDK
        run: |
          curl -L -sS -o /tmp/renpy.tar.bz2 https://github.com/renpy/renpy/releases/download/8.5.3.26051504/renpy-8.5.3-sdk.tar.bz2
          mkdir -p /tmp/sdk
          tar -xjf /tmp/renpy.tar.bz2 -C /tmp/sdk --strip-components=1
          python3 tools/test_renpy_load.py /tmp/sdk > test_output.txt 2>&1

      - name: Push official +00kurdish_tl.rpyc & test_output.txt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test_output.txt
          if [ -f "data/+00kurdish_tl.rpyc" ]; then
            git add "data/+00kurdish_tl.rpyc"
          fi
          git commit -m "build: compile official +00kurdish_tl.rpyc with Ren'Py 8.5.3 SDK [skip ci]" || true
          git pull --rebase origin arena/a685ecde-drak
          git push origin HEAD:arena/a685ecde-drak
