name: Kurdish Sorani APK Translator

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct or Dropbox ?dl=0/?dl=1 link to the Unity .apk or unique_en.json"
        required: true
        type: string
      mode:
        description: "extract_only, full_pipeline (APK), or avg_translate (unique_en.json -> unique_ckb.json)"
        required: true
        default: "extract_only"
        type: choice
        options:
          - extract_only
          - full_pipeline
          - avg_translate
      rtl_mode:
        description: "Kurdish RTL mode for full_pipeline"
        required: false
        default: "logical"
        type: choice
        options:
          - logical
          - visual
          - pua

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run unit tests
        run: pytest -v

  translate-freya-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/a84f22f1-drak'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download android.zip parts, translate to Kurdish Sorani, and repack android.ab
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee /tmp/freya_ci.log || { echo "::error::$(tail -n 35 /tmp/freya_ci.log | tr '\n' ' ')"; exit 1; }
          import json, subprocess, sys, zipfile
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from kurdish_game_translator.apk_extractor import download_apk

          urls = [
              "https://www.dropbox.com/scl/fi/dqiyf1nqb0bswgdxnfqyt/android.zip.001?rlkey=g5z4qcsvfmvdsen5wta2jbdx7&dl=1",
              "https://www.dropbox.com/scl/fi/djpfxjc4nxowrsrdck31p/android.zip.002?rlkey=aobo3wf66i9nh2at6k9v1cewm&dl=1",
              "https://www.dropbox.com/scl/fi/70tezklf3ir4m0ksm2gq3/android.zip.003?rlkey=h0f78djio6d5livzb99x2yzfu&dl=1",
              "https://www.dropbox.com/scl/fi/gwg7uzpqrxh1knkrtrx9k/android.zip.004?rlkey=c8fp25nznmsoujp7qae7ychrb&dl=1",
              "https://www.dropbox.com/scl/fi/1wor60uebl72e8me1yx4l/android.zip.005?rlkey=82bh3gs2h8grxj5ib1c8r8kfq&dl=1",
              "https://www.dropbox.com/scl/fi/ki3zrd43pvbx2u6awiuu5/android.zip.006?rlkey=0bwqpvw0gu87ko7b1to6o20o2&dl=1",
          ]
          work = Path("work_avg")
          parts_dir = work / "parts"
          parts_dir.mkdir(parents=True, exist_ok=True)
          with ThreadPoolExecutor(max_workers=6) as pool:
              futs = [pool.submit(download_apk, u, parts_dir / f"android.zip.{i:03d}") for i, u in enumerate(urls, 1)]
              for f in futs:
                  p = f.result()
                  print("Downloaded", p, p.stat().st_size, flush=True)

          zip_path = work / "android.zip"
          with zip_path.open("wb") as out:
              for i in range(1, 7):
                  out.write((parts_dir / f"android.zip.{i:03d}").read_bytes())
                  (parts_dir / f"android.zip.{i:03d}").unlink()
          print("Combined zip:", zip_path.stat().st_size, flush=True)
          with zipfile.ZipFile(zip_path, "r") as zf:
              zf.extractall(work / "unpacked")
          zip_path.unlink()
          ab_path = work / "unpacked" / "android.ab"
          print("Unpacked android.ab:", ab_path.stat().st_size, flush=True)

          subprocess.run([sys.executable, "-m", "kurdish_game_translator.cli", "avg-extract", str(ab_path), "-o", "work_avg"], check=True)
          subprocess.run([sys.executable, "-m", "kurdish_game_translator.cli", "avg-translate", "work_avg/unique_en.json", "-o", "work_avg/unique_ckb.json", "--workers", "10"], check=True)
          items = json.loads((work / "unique_ckb.json").read_text(encoding="utf-8"))
          ckb_changed = sum(1 for x in items if x.get("ckb") and x["ckb"] != x["en"])
          print(f"::notice::Translated {ckb_changed}/{len(items)} unique strings to Kurdish Sorani", flush=True)
          if ckb_changed < 1000:
              raise RuntimeError(f"Too few strings translated ({ckb_changed}/{len(items)})")
          subprocess.run([sys.executable, "-m", "kurdish_game_translator.cli", "avg-pack", str(ab_path), "work_avg/unique_ckb.json", "-w", "work_avg", "-o", "work_avg/android.ab", "--rtl-mode", "visual"], check=True)
          print(f"::notice::Repacked android.ab size={(work / 'android.ab').stat().st_size}", flush=True)
          PY
      - name: Upload Kurdish android.ab and unique_ckb.json
        uses: actions/upload-artifact@v4
        with:
          name: android-ab-kurdish
          path: |
            work_avg/android.ab
            work_avg/unique_ckb.json
          retention-days: 7

  run-apk-job:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Extract or translate APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          JOB_MODE: ${{ inputs.mode }}
          RTL_MODE: ${{ inputs.rtl_mode }}
        run: |
          mkdir -p work
          if [ "$JOB_MODE" = "extract_only" ]; then
            python -m kurdish_game_translator.cli extract "$APK_URL" -o work
          elif [ "$JOB_MODE" = "avg_translate" ]; then
            python -c "from pathlib import Path; from kurdish_game_translator.apk_extractor import download_apk; download_apk('$APK_URL', Path('work/unique_en.json'))"
            python -m kurdish_game_translator.cli avg-translate work/unique_en.json -o work/unique_ckb.json
          else
            python -m kurdish_game_translator.cli pipeline "$APK_URL" -w work -o work/translated_ckb.apk --rtl-mode "$RTL_MODE"
          fi
      - name: Upload extracted strings / translated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurdish-game-output
          path: |
            work/strings.json
            work/strings_ckb.json
            work/unique_ckb.json
            work/translated_ckb.apk
          if-no-files-found: warn
          retention-days: 7
