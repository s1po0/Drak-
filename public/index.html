<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#101012">
  <title>Unreal Engine 4.24</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="ue4-canvas" tabindex="0"></canvas>

  <div id="ue4-splash" class="splash">
    <div class="splash__inner">
      <div class="splash__mark" aria-label="Unreal Engine 4.24">
        <svg viewBox="0 0 96 96" width="72" height="72" role="img" aria-hidden="true">
          <circle cx="48" cy="48" r="44" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M48 20 66 76H56L48 50 40 76H30Z" fill="currentColor" opacity=".92"/>
          <path d="M64 20h14l-9 30-5-30Z" fill="currentColor" opacity=".55"/>
        </svg>
      </div>

      <h1 class="splash__title">Unreal Engine 4.24</h1>
      <p id="ue4-status" class="splash__status">Host online &mdash; loading payload&hellip;</p>

      <div class="splash__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="ue4-progressbar">
        <div id="ue4-progress" class="splash__fill"></div>
      </div>

      <p id="ue4-detail" class="splash__detail"></p>
      <noscript>
        <p class="splash__detail">This host needs JavaScript. Enable it and reload the page.</p>
      </noscript>
    </div>
  </div>

  <div id="ue4-error" class="error" hidden>
    <div class="error__inner">
      <h2 id="ue4-error-title">Host error</h2>
      <p id="ue4-error-message"></p>
      <pre id="ue4-error-stack" hidden></pre>
      <button id="ue4-error-reload" type="button">Reload</button>
    </div>
  </div>

  <script>
    // Host configuration. Point these at the output of
    // UE 4.24 > File > Package Project > HTML5 after copying it into public/build/.
    window.UE4_HOST_CONFIG = {
      // 'demo/' loads the placeholder payload shipped with this repo so the host
      // can be previewed. Switch to 'build/' once a real UE 4.24 package is copied
      // into public/build/.
      buildDir: 'demo/',
      buildName: 'UE4Game',
      gameName: 'Unreal Engine 4',
      engineVersion: '4.24',
      backgroundColor: '#000000',
      // UE 4.24 HTML5 packages single-threaded by default; enable only for
      // pthread / SharedArrayBuffer builds.
      requireCrossOriginIsolation: false
    };
  </script>
  <script src="host.js"></script>
</body>
</html>
